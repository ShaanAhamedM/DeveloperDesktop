# ==============================================================================
#  tmux.conf - Nordic Charcoal Terminal Multiplexer Configuration
#  Maintained by: Shaan
# ==============================================================================

# --- Prefix & Ergonomics ---
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
set -s escape-time 0
set -g history-limit 50000

# --- Window & Pane Indexing (1-Based) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- True 24-Bit Color & Terminal Emulation ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Intuitive Window Splitting ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Vim-Style Pane Navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-Vim keys without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# --- Vi Mode for Copy Buffer ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"

# --- Nordic Charcoal Visual Theme ---
set -g status-position top
set -g status-justify left
set -g status-style "bg=#11111b,fg=#cdd6f4"

# Borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89dceb"

# Status Left
set -g status-left-length 40
set -g status-left "#[bg=#89dceb,fg=#11111b,bold] 󰞷 #S #[bg=#181825,fg=#89dceb] "

# Status Right
set -g status-right-length 80
set -g status-right "#[bg=#181825,fg=#89b4fa]  %H:%M #[bg=#313244,fg=#cdd6f4] 󰸗 %a %d %b "

# Window Status Formatting
setw -g window-status-format "#[bg=#181825,fg=#6c7086] #I: #W "
setw -g window-status-current-format "#[bg=#89dceb,fg=#11111b,bold] #I: #W "
setw -g window-status-separator ""
