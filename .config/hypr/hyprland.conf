# ==============================================================================
#  Hyprland Compositor Configuration - Nordic Charcoal Minimalist
#  Maintained by: Shaan
# ==============================================================================

# --- Monitor Setup ---
# Automatically adapt to any connected display at native resolution and refresh rate
monitor=,preferred,auto,1

# --- Autostart Daemons & Background Tools ---
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
    sensitivity = 0 # -1.0 to 1.0, 0 means no modification
}

# --- General Layout (8-Point Grid & Symmetry) ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(89dcebee)
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    allow_tearing = false
}

# --- Window Decoration & Aesthetics ---
decoration {
    rounding = 8
    active_opacity = 0.98
    inactive_opacity = 0.92
    
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000033)
    }
}

# --- Non-Distracting, Snappy Animations ---
animations {
    enabled = yes
    bezier = snappy, 0.25, 1, 0.5, 1
    
    animation = windows, 1, 2, snappy
    animation = windowsOut, 1, 2, snappy, popin 80%
    animation = border, 1, 2, snappy
    animation = borderangle, 0
    animation = fade, 1, 2, snappy
    animation = workspaces, 1, 2, snappy
}

# --- Tiling Layout Details ---
dwindle {
    pseudotile = yes
    preserve_split = yes
    force_split = 2
}

# --- Window Rules & Automatic Workspace Routing (Bonus) ---
windowrulev2 = workspace 1, class:^(code|Code|vscodium|codium)$
windowrulev2 = workspace 2, class:^(firefox|google-chrome|chromium|brave-browser)$
windowrulev2 = workspace 4, class:^(slack|discord|teams-for-linux)$
windowrulev2 = workspace 5, class:^(spotify|Spotify)$

# Floating Rules for Utility Popups
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = size 700 500, class:^(pavucontrol)$

# --- Keybindings (Core Requirement 2) ---
$mainMod = SUPER

# Core App Launchers
bind = $mainMod, Return, exec, kitty
bind = $mainMod, SPACE, exec, rofi -show drun
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, W, exec, rofi -show window
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, M, exec, kitty -e btop
bind = $mainMod, O, exec, $HOME/.config/scripts/project_picker.sh

# Productivity & System
bind = $mainMod SHIFT, slash, exec, $HOME/.config/scripts/cheat_sheet.sh
bind = $mainMod SHIFT, E, exec, $HOME/.config/scripts/power_menu.sh

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, togglesplit,

# Vim-Style Window Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspace Switching (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (1 - 9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Window Control (Drag & Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (Selection or Full Screen) to Clipboard & File
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Selection copied to clipboard"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Selection copied to clipboard"
bind = $mainMod CTRL, S, exec, grim "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" && notify-send "Screenshot" "Full screen saved"

# Scratchpad Dropdown Terminal (Special Workspace)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad
