# ==============================================================================
#  Kitty Terminal Configuration - Nordic Charcoal Minimalist
#  Maintained by: Shaan
# ==============================================================================

# --- Typography & Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Geometry & Window Padding ---
window_padding_width 12
placement_strategy   center
remember_window_size no
initial_window_width  960
initial_window_height 600

# --- Background & Opacity ---
background_opacity         0.92
dynamic_background_opacity yes
hide_window_decorations    yes
confirm_os_window_close    0

# --- Cursor ---
cursor                #89dceb
cursor_text_color     #11111b
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# --- Mouse & Scrolling ---
mouse_hide_wait      3.0
wheel_scroll_multiplier 3.0
enable_audio_bell    no

# --- Colors (Nordic Charcoal Spec) ---
background #11111b
foreground #cdd6f4

# Selection
selection_background #313244
selection_foreground #cdd6f4

# URL underline color when hovering
url_color #89dceb

# 16 Terminal Colors
# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #eba0ac

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #cba6f7
color13 #f5c2e7

# Cyan
color6  #89dceb
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# --- Tab Bar Aesthetics ---
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground   #11111b
active_tab_background   #89dceb
inactive_tab_foreground #6c7086
inactive_tab_background #181825
tab_bar_background      #11111b
